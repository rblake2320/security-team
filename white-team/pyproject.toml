[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-white-team"
version = "0.1.0"
description = "Independent exercise control: authorization, scope enforcement, stop authority, evidence integrity, after-action reporting"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis-white = "aegis_white.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
