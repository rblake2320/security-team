[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-green-team"
version = "0.1.0"
description = "Defensive security engineering: telemetry quality (DeTT&CT), ATT&CK coverage, defensibility scoring"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis-green = "aegis_green.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
