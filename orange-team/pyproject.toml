[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-orange-team"
version = "0.1.0"
description = "Adversarial design review: STRIDE-per-element coverage, attack-path discovery, safe test conversion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis-orange = "aegis_orange.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
