[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-red-team"
version = "0.2.0"
description = "Authorization-first red-team assessment orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{name = "PKA Testing"}]
dependencies = ["cryptography==50.0.0"]

[project.scripts]
aegis-rt = "aegis_rt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
