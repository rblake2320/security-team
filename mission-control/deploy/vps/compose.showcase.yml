name: aegis-public-showcase

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  showcase:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        AEGIS_WEB_BUILD: showcase
        AEGIS_COMMIT: ${AEGIS_COMMIT:-unknown}
    image: aegis-mission-control-showcase:${AEGIS_IMAGE_TAG:-local}
    restart: unless-stopped
    entrypoint: ["python", "server.py"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--mode", "demo", "--root", "/nonexistent"]
    environment:
      AEGIS_ALLOW_DEMO_BIND: "1"
    expose: ["8080"]
    networks: [showcase-edge]
    read_only: true
    tmpfs:
      - /app/runtime:size=16m,noexec,nosuid,nodev
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging

  tunnel:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${SHOWCASE_TUNNEL_TOKEN:?set in .env.showcase}
    depends_on: [showcase]
    networks: [showcase-edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging

networks:
  showcase-edge:
