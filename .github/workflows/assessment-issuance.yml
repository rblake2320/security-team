name: assessment-issuance-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-assessment-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, node24
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e purple-team
      - name: Refuse issuance unless every prerequisite and claim invariant passes
        run: python -m aegis_purple validate-program --readiness 00-shared/config/assessment_readiness.json --claims 00-shared/config/assurance_claims.json --require-ready
