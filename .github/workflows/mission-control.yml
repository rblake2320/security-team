name: Mission Control

on:
  push:
    branches: [main]
    paths:
      - "mission-control/**"
      - ".github/workflows/mission-control.yml"
  pull_request:
    paths:
      - "mission-control/**"
      - ".github/workflows/mission-control.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Trivy 0.74.0, pinned to the official multi-platform OCI digest.
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

concurrency:
  group: mission-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, node24
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, node24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mission-control/web/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install -r .\mission-control\requirements-dev.txt
          python -m pip install pip-audit

      - name: Backend contracts
        working-directory: mission-control
        run: python -m pytest -q --cov=aegis_platform --cov=aegis_connector --cov-report=term --cov-fail-under=80

      - name: Python dependency audit
        working-directory: mission-control
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off --cache-dir runtime/pip-audit-cache

      - name: Migration upgrade and drift check
        working-directory: mission-control
        env:
          DATABASE_URL: sqlite:///runtime/ci-migration.db
        run: |
          alembic upgrade head
          alembic check

      - name: Install frontend dependencies
        working-directory: mission-control/web
        run: npm ci

      - name: Dependency audit
        working-directory: mission-control/web
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: mission-control/web
        run: npm run typecheck

      - name: Production build
        working-directory: mission-control/web
        run: npm run build

      - name: Install browser for interface regression
        run: python -m playwright install chromium

      - name: Onboarding and responsive interface regression
        working-directory: mission-control
        run: python tools/test_onboarding_ui.py

      - name: Build isolated public showcase
        working-directory: mission-control/web
        run: npm run build:showcase

      - name: Interactive public mission regression
        working-directory: mission-control
        run: python tools/test_showcase_journey.py

      - name: Verify public bundle boundary
        working-directory: mission-control
        run: python tools/test_showcase_bundle.py

      - name: Upload production shell
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, node24
        with:
          name: aegis-mission-control-showcase-web
          path: mission-control/web/dist
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, node24

      - name: Validate release automation
        run: |
          bash -n mission-control/deploy/vps/release.sh
          sh -n mission-control/deploy/vps/backup.sh
          sh -n mission-control/deploy/vps/restore-drill.sh

      - name: Prove backup and isolated restore automation
        shell: bash
        run: |
          set -euo pipefail
          image='postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685'
          network="aegis-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          db_container="aegis-recovery-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backup_volume="aegis-recovery-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_dir="$RUNNER_TEMP/aegis-recovery-evidence"
          mkdir -p "$evidence_dir"
          printf 'synthetic encrypted evidence payload\n' > "$evidence_dir/sample.aegis"
          docker network create "$network" >/dev/null
          docker volume create "$backup_volume" >/dev/null
          docker run --detach --rm --name "$db_container" --network "$network" --network-alias db \
            --env POSTGRES_DB=aegis_recovery_ci \
            --env POSTGRES_USER=aegis_admin \
            --env POSTGRES_PASSWORD=ci-only-recovery-password \
            "$image" >/dev/null
          cleanup() {
            docker rm --force "$db_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm "$backup_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          database_ready=0
          for _ in $(seq 1 45); do
            if docker exec "$db_container" psql --username aegis_admin --dbname aegis_recovery_ci \
              --no-align --tuples-only --command 'SELECT 1' >/dev/null 2>&1; then
              database_ready=1
              break
            fi
            sleep 1
          done
          test "$database_ready" -eq 1
          docker exec "$db_container" psql --username aegis_admin --dbname aegis_recovery_ci --set ON_ERROR_STOP=1 \
            --command 'CREATE TABLE organizations (id text PRIMARY KEY, name text NOT NULL); INSERT INTO organizations VALUES ('\''tenant-a'\'', '\''Synthetic tenant'\'');'
          common=(--rm --network "$network" \
            --env POSTGRES_DB=aegis_recovery_ci \
            --env POSTGRES_USER=aegis_admin \
            --env POSTGRES_PASSWORD=ci-only-recovery-password \
            --volume "$backup_volume:/var/backups/aegis")
          docker run "${common[@]}" \
            --volume "$evidence_dir:/var/lib/aegis/evidence:ro" \
            --volume "$PWD/mission-control/deploy/vps/backup.sh:/opt/aegis/backup.sh:ro" \
            --entrypoint /bin/sh "$image" /opt/aegis/backup.sh
          docker run "${common[@]}" \
            --env RESTORE_DRILL_DATABASE=aegis_ci_restore_drill \
            --volume "$PWD/mission-control/deploy/vps/restore-drill.sh:/opt/aegis/restore-drill.sh:ro" \
            --entrypoint /bin/sh "$image" /opt/aegis/restore-drill.sh
          test -z "$(docker exec "$db_container" psql --username aegis_admin --dbname postgres --no-align --tuples-only --command \"SELECT datname FROM pg_database WHERE datname = 'aegis_ci_restore_drill'\")"
          docker run --rm --volume "$backup_volume:/data:ro" --entrypoint sh "$image" -c \
            'receipt="$(find /data/restore-receipts -maxdepth 1 -type f -name "*.json" -print -quit)"; test -n "$receipt"; cat "$receipt"' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='passed' and d['rowCountsVerified'] and d['disposableDatabaseDropped']"

      - name: Build production image
        run: docker build --pull --build-arg AEGIS_COMMIT="$GITHUB_SHA" --tag aegis-mission-control:ci ./mission-control

      - name: Build customer-edge connector image
        run: docker build --pull --file mission-control/Dockerfile.connector --build-arg AEGIS_COMMIT="$GITHUB_SHA" --tag aegis-connector:ci ./mission-control

      - name: Inspect connector runtime boundary
        run: |
          test "$(docker image inspect aegis-connector:ci --format '{{.Config.User}}')" = "aegis"
          test "$(docker image inspect aegis-connector:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python aegis-connector:ci -c "import aegis_connector; assert aegis_connector.__version__ == '1.0.0'"

      - name: Generate SBOM and gate container vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/aegis-container-security"
          mkdir -p "$report_dir"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$report_dir:/reports" \
            "$TRIVY_IMAGE" image \
            --format spdx-json \
            --output /reports/aegis-mission-control.spdx.json \
            --no-progress \
            aegis-mission-control:ci
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$report_dir:/reports" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /reports/aegis-mission-control-vulnerabilities.json \
            --no-progress \
            aegis-mission-control:ci
          python - "$report_dir" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          report_dir = pathlib.Path(sys.argv[1])
          commit = sys.argv[2]
          sbom_path = report_dir / "aegis-mission-control.spdx.json"
          vulnerability_path = report_dir / "aegis-mission-control-vulnerabilities.json"
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          vulnerabilities = json.loads(vulnerability_path.read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3" or not sbom.get("packages"):
              raise SystemExit("Trivy did not produce a populated SPDX 2.3 SBOM")
          actionable = [
              finding
              for result in vulnerabilities.get("Results") or []
              for finding in result.get("Vulnerabilities") or []
              if finding.get("Severity") in {"HIGH", "CRITICAL"}
          ]
          if actionable:
              raise SystemExit(f"container scan retained {len(actionable)} high/critical findings")
          image_id = subprocess.check_output(
              ["docker", "image", "inspect", "aegis-mission-control:ci", "--format", "{{.Id}}"],
              text=True,
          ).strip()
          revision = subprocess.check_output(
              [
                  "docker",
                  "image",
                  "inspect",
                  "aegis-mission-control:ci",
                  "--format",
                  "{{index .Config.Labels \"org.opencontainers.image.revision\"}}",
              ],
              text=True,
          ).strip()
          if revision != commit:
              raise SystemExit(f"image revision {revision!r} does not match commit {commit!r}")
          files = {}
          for path in (sbom_path, vulnerability_path):
              files[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
          receipt = {
              "schemaVersion": 1,
              "commit": commit,
              "image": "aegis-mission-control:ci",
              "imageId": image_id,
              "revisionLabel": revision,
              "scanner": "trivy-0.74.0",
              "policy": "no fixed-available HIGH or CRITICAL vulnerabilities",
              "status": "passed",
              "files": files,
          }
          (report_dir / "RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload container security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, node24
        with:
          name: aegis-container-security-${{ github.sha }}
          path: ${{ runner.temp }}/aegis-container-security
          if-no-files-found: warn
          retention-days: 30

      - name: Verify real ClamAV evidence scanning
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --publish 127.0.0.1:3311:3310 clamav/clamav:stable@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591)"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 90); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = healthy ]; then
              docker run --rm --network host --entrypoint python \
                --env CLAMAV_HOST=127.0.0.1 \
                --env CLAMAV_PORT=3311 \
                --env PYTHONPATH=/app \
                --volume "$PWD/mission-control/tools/verify_clamav.py:/tmp/verify_clamav.py:ro" \
                aegis-mission-control:ci /tmp/verify_clamav.py
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

      - name: Verify PostgreSQL row-level tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          admin_password="ci-only-not-a-secret-admin-password"
          runtime_password="ci-only-not-a-secret-runtime-password-32"
          database="aegis_rls_test"
          container_id="$(docker run --detach --rm \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB="$database" \
            --env POSTGRES_USER=aegis_admin \
            --env POSTGRES_PASSWORD="$admin_password" \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685)"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 45); do
            if docker exec "$container_id" pg_isready --username aegis_admin --dbname "$database"; then
              admin_url="postgresql+psycopg://aegis_admin:${admin_password}@127.0.0.1:55432/${database}"
              docker run --rm --network host --entrypoint sh \
                --env DATABASE_ADMIN_URL="$admin_url" \
                --env AEGIS_DB_RUNTIME_PASSWORD="$runtime_password" \
                --env AEGIS_RLS_TEST_MODE=confirmed-synthetic-database \
                --env PYTHONPATH=/app \
                --volume "$PWD/mission-control/tools/verify_postgres_rls.py:/tmp/verify_postgres_rls.py:ro" \
                aegis-mission-control:ci -c \
                'DATABASE_URL="$DATABASE_ADMIN_URL" alembic upgrade head && python -m aegis_platform.db_roles provision && python /tmp/verify_postgres_rls.py'
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

      - name: Prove fresh PostgreSQL multi-worker bootstrap
        shell: bash
        run: |
          set -euo pipefail
          admin_password="ci-only-not-a-secret-admin-password"
          runtime_password="ci-only-not-a-secret-runtime-password-32"
          database="aegis_multiworker_test"
          db_id="$(docker run --detach --rm \
            --publish 127.0.0.1:55433:5432 \
            --env POSTGRES_DB="$database" \
            --env POSTGRES_USER=aegis_admin \
            --env POSTGRES_PASSWORD="$admin_password" \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685)"
          app_id=""
          cleanup() {
            if [ -n "$app_id" ]; then docker rm --force "$app_id" >/dev/null 2>&1 || true; fi
            docker rm --force "$db_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 45); do
            if docker exec "$db_id" pg_isready --username aegis_admin --dbname "$database"; then break; fi
            sleep 1
          done
          admin_url="postgresql+psycopg://aegis_admin:${admin_password}@127.0.0.1:55433/${database}"
          app_id="$(docker run --detach --rm --network host --tmpfs /tmp:size=128m,noexec,nosuid,nodev \
            --env AEGIS_ENV=production \
            --env AEGIS_COMMIT="$GITHUB_SHA" \
            --env AEGIS_HOST=127.0.0.1 \
            --env AEGIS_PORT=18082 \
            --env AEGIS_WORKERS=2 \
            --env DATABASE_ADMIN_URL="$admin_url" \
            --env AEGIS_DB_RUNTIME_PASSWORD="$runtime_password" \
            --env AUTH_MODE=cloudflare \
            --env CF_ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com \
            --env CF_ACCESS_AUD=ci-audience \
            --env PUBLIC_HOSTNAME=mission.ci.invalid \
            --env TOKEN_PEPPER=ci-only-token-pepper-0123456789abcdef \
            --env EVIDENCE_MASTER_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY \
            --env EVIDENCE_ROOT=/tmp/evidence \
            --env EVIDENCE_SCANNER_MODE=clamav \
            --env CLAMAV_HOST=127.0.0.1 \
            --env CLAMAV_PORT=9 \
            --env BOOTSTRAP_EMAIL=owner@ci.invalid \
            --env BOOTSTRAP_ORGANIZATION='AEGIS CI' \
            --env BOOTSTRAP_SLUG=aegis-ci \
            aegis-mission-control:ci)"
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18082/api/health >/dev/null; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$app_id")" != true ]; then
              docker logs "$app_id"
              exit 1
            fi
            sleep 1
          done
          sleep 2
          logs="$(docker logs "$app_id" 2>&1)"
          if grep -E -q 'Traceback|Child process .* died|OperationalError|IntegrityError' <<<"$logs"; then
            printf '%s\n' "$logs"
            exit 1
          fi
          test "$(grep -c 'Started server process' <<<"$logs")" -ge 2

      - name: Inspect runtime user
        run: test "$(docker image inspect aegis-mission-control:ci --format '{{.Config.User}}')" = "aegis"

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach aegis-mission-control:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Reject an unwritable evidence store
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --read-only --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --env DATABASE_URL=sqlite:////tmp/platform.db \
            --env EVIDENCE_ROOT=/app \
            aegis-mission-control:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"; then
              break
            fi
            sleep 1
          done
          docker exec -i "$container_id" python - <<'PY'
          import urllib.error
          import urllib.request

          try:
              urllib.request.urlopen("http://127.0.0.1:8080/api/ready", timeout=2)
          except urllib.error.HTTPError as exc:
              assert exc.code == 503
          else:
              raise SystemExit("readiness accepted an unwritable evidence store")
          PY

      - name: Prove clean multi-worker startup and bounded concurrency
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --publish 127.0.0.1:18081:8080 \
            --env AEGIS_WORKERS=2 aegis-mission-control:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=2).read()"; then
              break
            fi
            sleep 1
          done
          sleep 2
          logs="$(docker logs "$container_id" 2>&1)"
          if grep -E -q 'Traceback|Child process .* died|OperationalError' <<<"$logs"; then
            printf '%s\n' "$logs"
            exit 1
          fi
          test "$(grep -c 'Started server process' <<<"$logs")" -ge 2
          docker run --rm --network host \
            --env AEGIS_COMMIT="$GITHUB_SHA" \
            --volume "$PWD/mission-control/tools/run_capacity_probe.py:/tmp/run_capacity_probe.py:ro" \
            --volume "$PWD/mission-control/capacity/ci-concurrency-smoke.json:/tmp/profile.json:ro" \
            --entrypoint python aegis-mission-control:ci \
            /tmp/run_capacity_probe.py /tmp/profile.json --base-url http://127.0.0.1:18081

      - name: Build isolated showcase image
        run: docker build --build-arg AEGIS_WEB_BUILD=showcase --tag aegis-mission-control-showcase:ci ./mission-control

      - name: Inspect showcase runtime user
        run: test "$(docker image inspect aegis-mission-control-showcase:ci --format '{{.Config.User}}')" = "aegis"
