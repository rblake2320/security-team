name: engineering-integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install reviewed test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-runtime.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e purple-team -e red-team
      - name: Static and compilation gates
        # Single source of truth: 00-shared/tools/run_static.py, also invoked by the
        # local runner. Duplicating the target list here is how ruff ran in CI but not
        # locally, and a lint error reached CI on 2026-08-14.
        run: python 00-shared/tools/run_static.py
      - name: Runtime dependency vulnerability gate
        run: python -m pip_audit -r tools/requirements-runtime.txt --disable-pip --progress-spinner off
      - name: Shared cryptographic commitment tests
        run: python 00-shared/tools/test_commitment.py
      - name: Repository hygiene and CI reachability
        run: python -m unittest discover -s 00-shared/tools -p 'test_repo_hygiene.py' -v
      - name: CI gate-manifest drift guard
        run: python -m unittest discover -s 00-shared/tools -p 'test_gate_manifest.py' -v
      - name: CI separation guard
        run: python -m unittest discover -s 00-shared/tools -p 'test_ci_integrity.py' -v
      - name: Purple orchestration tests
        run: python -m unittest discover -s purple-team/tests -v
      - name: Disposable integrated rehearsal
        run: python -m unittest discover -s exercise/tests -v
      - name: Red boundary tests - skips forbidden in CI
        run: python tools/ci_unittest_gate.py --source red-team/src --tests red-team/tests --forbid-skips
      - name: Blue defensive-core tests
        run: python tools/ci_unittest_gate.py --source blue-team/src --tests blue-team/tests
      - name: Program consistency and honest readiness marking
        run: |
          python tools/verify_canonical_packages.py
          python -m aegis_purple validate-program --readiness 00-shared/config/assessment_readiness.json --claims 00-shared/config/assurance_claims.json
          python 00-shared/tools/claim_check.py --allow-not-ready
          python tools/assert_current_hold.py
      - name: Markdown link integrity
        run: python 00-shared/tools/check_links.py
      - name: Local runner parity with the gate manifest
        run: python 00-shared/tools/run_ci.py

  pr-summary:
    # Every gate result was visible only in the Actions logs/checks tab, never on
    # the PR itself where a reviewer is actually looking. This posts what a
    # generic code-review bot cannot - this program's own specific assurance
    # model (R1-R7 claim verification, readiness-gate state), not generic
    # style/security commentary. Runs independently of the verify matrix so a
    # gate failure there still gets reported on the PR, not just in the logs.
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install reviewed test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-runtime.txt
          python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e purple-team -e red-team
      - name: Run gates and post/update the PR summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          MARKER="<!-- format_pr_summary:auto -->"
          python 00-shared/tools/run_ci.py --json > ci_result.json || true
          { echo "$MARKER"; python 00-shared/tools/format_pr_summary.py < ci_result.json; } > comment_body.md
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body=@comment_body.md
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment_body.md
          fi
